name: Build dashboard

# Build the dashboard from the "data" branch and email temperature alerts. Started by the lab computers
# after each upload (repository_dispatch), by the backup timer, or by the "Run workflow" button.
#  - Always saves it as a downloadable zip ("lab-dashboard" under the run's Artifacts).
#  - Also publishes it to GitHub Pages if the repository variable USE_PAGES is "true"
#    (needs a public repo, or a private repo on GitHub Pro/Team; see README section 5).

on:
  repository_dispatch:         # sent by the lab computers right after they upload a report
    types: [report]
  schedule:
    - cron: "3-59/10 * * * *" # backup timer every 10 min (GitHub often delays or skips these;
                                # the computers' own trigger above is what keeps the page fresh).
                                # Private repo on the free plan? use "7 * * * *" (hourly) to stay within free minutes.
  workflow_dispatch:           # "Run workflow" button in the Actions tab
    inputs:
      test_email:
        description: "Send a test email (checks the alert settings)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # main: scripts + computers.json

      - name: Get the data branch (written by the lab computers)
        run: |
          mkdir -p data-branch/data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git --work-tree=data-branch checkout FETCH_HEAD -- data || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - run: pip install -r dashboard/requirements.txt

      - run: python dashboard/make_plots.py --data data-branch/data --names computers.json --out site --days 20

      # ---- email alerts (does nothing until SMTP_USER / SMTP_PASSWORD secrets exist)
      - name: Restore alert memory
        uses: actions/cache/restore@v4
        with:
          path: alert-state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check temperatures and email if needed
        continue-on-error: true      # a mail problem must never stop the dashboard from updating
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          ALERT_TEMP: ${{ vars.ALERT_TEMP }}
          ALERT_REPEAT_HOURS: ${{ vars.ALERT_REPEAT_HOURS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: python dashboard/alerts.py --data data-branch/data --names computers.json --state alert-state/state.json ${{ inputs.test_email && '--test-email' || '' }}

      - name: Save alert memory
        if: hashFiles('alert-state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alert-state
          key: alert-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save dashboard as a downloadable zip
        uses: actions/upload-artifact@v4
        with:
          name: lab-dashboard
          path: site
          retention-days: 1          # keeps storage use low; a new one is made every 10 minutes

      - name: Prepare GitHub Pages upload
        if: vars.USE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}   # unique per attempt, so "Re-run" works

  deploy:
    if: vars.USE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
